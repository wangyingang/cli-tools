[project]
name = "subtitle-extractor"
version = "0.1.0"
description = "A high-performance tool to extract hardcoded subtitles from videos using OCR and multiprocessing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.12.0.88",
    "rapidocr-onnxruntime>=1.4.4",
    "tqdm>=4.67.1",
]

[project.scripts]
# 这里定义了全局调用的命令名称
subx = "main:main"